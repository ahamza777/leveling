<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monthly Alarm PWA</title>

<link rel="manifest" href="manifest.json">

<style>
body{
    margin:0;
    font-family:Segoe UI,sans-serif;
    background:#0a0a0f;
    color:white;
    text-align:center;
}
.panel{
    background:#111;
    padding:20px;
    margin:20px auto;
    border-radius:20px;
    border:2px solid #00f0ff;
    width:380px;
}
input,select{
    margin:6px;
    padding:8px;
    width:90%;
    border-radius:8px;
    border:none;
    background:#1a1a1a;
    color:white;
}
button{
    margin:10px;
    padding:10px 20px;
    border:none;
    border-radius:8px;
    background:#00f0ff;
    font-weight:bold;
    cursor:pointer;
}
.alarm-card{
    border:2px solid #00f0ff;
    margin:8px;
    padding:10px;
    border-radius:12px;
}
</style>
</head>
<body>

<div class="panel">
<h2>Monthly Alarm System</h2>
<input id="alarmName" placeholder="Alarm Name">
<input type="time" id="alarmTime">
<select id="alarmMonth"></select>
<input id="alarmDays" placeholder="Enter days (e.g. 1,5,12,20)">
<button onclick="addAlarm()">Add Alarm</button>
</div>

<div class="panel">
<h3>Your Alarms</h3>
<div id="alarmList"></div>
</div>

<script>

let alarms=[];

/* Register Service Worker */
if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js");
}

/* Fill Months */
const months=[
"January","February","March","April","May","June",
"July","August","September","October","November","December"
];

let monthSelect=document.getElementById("alarmMonth");
months.forEach((m,i)=>{
    let option=document.createElement("option");
    option.value=i;
    option.textContent=m;
    monthSelect.appendChild(option);
});

/* Save/Load */
function saveData(){
    localStorage.setItem("monthlyAlarms",JSON.stringify(alarms));
}
function loadData(){
    let data=JSON.parse(localStorage.getItem("monthlyAlarms"));
    if(data){
        alarms=data;
        renderAlarms();
        sendToSW();
    }
}

/* Add Alarm */
function addAlarm(){
    let name=document.getElementById("alarmName").value;
    let time=document.getElementById("alarmTime").value;
    let month=parseInt(document.getElementById("alarmMonth").value);
    let days=document.getElementById("alarmDays").value;

    if(!name || !time || !days){
        alert("Fill all fields");
        return;
    }

    let dayArray=days.split(",").map(d=>parseInt(d.trim()));

    alarms.push({name,time,month,days:dayArray});
    saveData();
    renderAlarms();
    sendToSW();
}

/* Render */
function renderAlarms(){
    let list=document.getElementById("alarmList");
    list.innerHTML="";
    alarms.forEach((a,i)=>{
        let div=document.createElement("div");
        div.className="alarm-card";
        div.innerHTML=`
            <b>${a.name}</b><br>
            ${months[a.month]} - Days: ${a.days.join(", ")}<br>
            Time: ${a.time}
        `;
        list.appendChild(div);
    });
}

/* Send to Service Worker */
function sendToSW(){
    if(navigator.serviceWorker.controller){
        navigator.serviceWorker.controller.postMessage({alarms});
    }
}

loadData();

</script>
</body>
</html>
